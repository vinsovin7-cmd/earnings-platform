<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A considered cinema and live viewing experience." />
    <title>Urban Cinema</title>
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <script type="module" crossorigin src="/src/cinema.tsx"></script>
  </head>
  <body>
    <div id="cinema-root"></div>
    <script>
      // Telegram WebApp initialization for Cinema
      if (window.Telegram && window.Telegram.WebApp) {
        const webApp = window.Telegram.WebApp;
        webApp.ready();
        webApp.expand();
        
        // Handle back button for cinema
        webApp.BackButton.onClick(() => {
          window.history.back();
        });
        
        // Extract initData
        if (webApp.initData && webApp.initDataUnsafe) {
          window.tgInitData = webApp.initDataUnsafe;
          localStorage.setItem('tg_init_data', JSON.stringify(webApp.initDataUnsafe));
        }
      }
    </script>
  </body>
</html>
